# APEX Running Analysis - Pipeline Configuration
# Edit this file to customize pipeline behavior

[DATABASE]
# Path to source databases for ETL
artemis_db_path = c:/smakrykoDBs/artemis.db
garmin_db_path = c:/smakrykoDBs/garmin_activities.db

# Path to output analysis database (created if doesn't exist)
apex_db_path = c:/smakrykoDBs/Apex.db

[USER_METRICS]
# Your fitness parameters - customize for accurate calculations
resting_heart_rate = 60
max_heart_rate = 190

# TRIMP calculation zones
trimp_low_threshold = 50
trimp_moderate_threshold = 100
trimp_high_threshold = 150

[TRAINING_ZONES]
# Speed zones (km/h)
slow_speed_threshold = 10
moderate_speed_threshold = 14

# ACWR (Acute:Chronic Workload Ratio) thresholds
acwr_optimal_low = 0.8
acwr_optimal_high = 1.3
acwr_warning_high = 1.5

# Load calculation windows (weeks)
acute_load_window = 1
chronic_load_window = 4

[WEIGHTING]
# Metric weights for overall score calculation (0.0-1.0, should sum ~1.0)
running_economy_weight = 0.20
vo2max_weight = 0.20
distance_weight = 0.20
efficiency_weight = 0.20
heart_rate_weight = 0.20

[DASHBOARD]
# Dashboard server configuration
streamlit_port = 8501
streamlit_theme = light  # 'light' or 'dark'
auto_open_browser = true

# Date range for initial visualization (days)
default_date_range = 90

[ETL]
# ETL process configuration
skip_existing_records = true  # Don't re-insert duplicate dates
batch_size = 100              # Records per batch insert
timeout_minutes = 10

[PROCESSING]
# Data processing configuration
calculate_monthly_summaries = true
calculate_speed_zones = true
fill_missing_values = true    # Interpolate missing data points

[VISUALIZATION]
# Visualization settings
include_radar_chart = true
include_trend_analysis = true
smoothing_window = 7  # Moving average window (days)

[LOGGING]
# Pipeline logging
log_level = INFO  # DEBUG, INFO, WARNING, ERROR
save_logs = false
log_file_path = ./pipeline_logs/

[EXPERIMENTAL]
# Experimental features
enable_hr_rs_deviation_analysis = false
enable_physiological_efficiency = false
enable_fatigue_index = false
enable_speed_based_metrics = false
